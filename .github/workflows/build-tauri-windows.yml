name: Build Tauri (Windows)

# Construye, firma y prueba el instalador de Windows de una app Tauri de la suite y lo deja
# como prerelease en la Release <tag> del repo de la app. NO publica nada: ni FTP, ni
# manifest, ni web (eso es R6). Paquete R4 de docs/distribucion/releases-automaticas.md
# (repo central, S-1069).
#
# Pruebas en el runner (S-1275, PAA2 P6-1): actualizacion desde la version anterior publicada
# (instalar, abrir y cerrar, actualizar conservando ajustes, desinstalar) y despues el smoke
# limpio. Lo que pasa queda en <app>-v<ver>-windows-pruebas.json, que lee la ficha de release.
#
# Solo se dispara a mano (o desde el «sí» de la tanda, R8): no hay entornos con aprobacion
# en el plan gratuito, asi que la puerta humana es el propio disparo.
#   gh workflow run build-tauri-windows.yml -R javierferraz/tsp-release-factory \
#     -f app=bright-cardinal -f repo=javierferraz/2610-bright-cardinal -f tag=v1.0.0

run-name: Windows ${{ inputs.app }} ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: Slug de la app (p. ej. bright-cardinal)
        required: true
        type: string
      repo:
        description: Repo de la app (p. ej. javierferraz/2610-bright-cardinal)
        required: true
        type: string
      tag:
        description: Tag a construir, vX.Y.Z (admite sufijo de pruebas, p. ej. v1.0.0-factory-test)
        required: true
        type: string

# El GITHUB_TOKEN solo lee esta fabrica. Todo lo del repo de la app va con APPS_TOKEN.
permissions:
  contents: read

concurrency:
  group: build-tauri-windows-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  build:
    # Doble cerrojo: solo workflow_dispatch y solo con el workflow de main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      # Las entradas se usan siempre por variable de entorno, nunca interpoladas en el script.
      APP: ${{ inputs.app }}
      APP_REPO: ${{ inputs.repo }}
      TAG: ${{ inputs.tag }}
      # Cliente de Azure Trusted Signing, fijado por version y por hash.
      TS_CLIENT_VERSION: 1.0.95
      TS_CLIENT_SHA256: 3BFCF1E0A3CB42AF1692F0A8ED45C15DE070C2DE86F28A59B2795D904D8A920F
    steps:
      - name: Validar entradas
        id: meta
        run: |
          if ($env:APP -notmatch '^[a-z0-9]+(-[a-z0-9]+)*$') { throw "app no valido: '$env:APP'" }
          if ($env:APP_REPO -notmatch '^javierferraz/[A-Za-z0-9._-]+$') { throw "repo no valido: '$env:APP_REPO'" }
          if (-not ($env:TAG -match '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$')) { throw "tag no valido: '$env:TAG' (se espera vX.Y.Z o vX.Y.Z-sufijo)" }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset=$env:APP-v$version-windows-x64-setup.exe" >> $env:GITHUB_OUTPUT
          "tauri_key_secret=TAURI_KEY_$($env:APP.ToUpper().Replace('-', '_'))" >> $env:GITHUB_OUTPUT
          $env:REPORT = Join-Path $env:RUNNER_TEMP 'report.md'
          $env:OUT = Join-Path $env:RUNNER_TEMP 'out'
          "REPORT=$env:REPORT" >> $env:GITHUB_ENV
          "OUT=$env:OUT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:OUT | Out-Null
          @(
            "## $env:APP $env:TAG (Windows)", '',
            "Repo ``$env:APP_REPO``, version X.Y.Z ``$version``.", '',
            '| Comprobacion | Resultado |', '|---|---|'
          ) | Set-Content -Path $env:REPORT -Encoding utf8

      # Antes de gastar 15 minutos de build: el token ve el repo y la Release no tiene ya
      # estos ficheros (no se pisan nunca).
      - name: Acceso al repo de la app y Release sin esos ficheros
        env:
          GH_TOKEN: ${{ secrets.APPS_TOKEN }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          gh api "repos/$env:APP_REPO" --jq .full_name *> $null
          if ($LASTEXITCODE -ne 0) { throw "APPS_TOKEN no puede leer $env:APP_REPO (token vacio, caducado o sin ese repo)" }
          $names = gh api "repos/$env:APP_REPO/releases/tags/$env:TAG" --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0) {
            $clash = @($names | Where-Object { $_ -in @($env:ASSET, "$env:ASSET.sig", 'SHA256SUMS.txt') })
            if ($clash.Count) { throw "La Release $env:TAG ya tiene: $($clash -join ', '). No se pisan; borralos a mano si hay que rehacerlos." }
            "| Release $env:TAG | ya existe, sin ficheros de Windows |" >> $env:REPORT
          } else {
            "| Release $env:TAG | no existe; se creara como prerelease |" >> $env:REPORT
          }
          # El 404 de una Release que no existe no es un fallo del paso.
          $global:LASTEXITCODE = 0

      # Los runners de Windows traen core.autocrlf=true y sacarian el codigo en CRLF. Se
      # construye con LF, como en el portatil y en Linux: hay tests que leen su propio fuente
      # (include_str!) y buscan "\n}\n" (Bright Cardinal, commands.rs).
      - name: Saltos de linea LF en el checkout
        run: git config --global core.autocrlf false

      - name: Checkout de la fabrica
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: factory
          persist-credentials: false

      - name: Checkout de la app en el tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.APPS_TOKEN }}
          path: app
          persist-credentials: false

      - name: El tag coincide con la version de tauri.conf.json
        id: conf
        working-directory: app
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $confVersion = $conf.version
          if ($confVersion -notmatch '^\d+\.\d+\.\d+') {
            # Tauri admite "version": "../package.json"
            $confVersion = (Get-Content (Join-Path src-tauri $confVersion) -Raw | ConvertFrom-Json).version
          }
          if ($confVersion -ne $env:VERSION) { throw "tauri.conf.json dice '$confVersion' y el tag $env:TAG pide '$env:VERSION'" }
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $env:VERSION) { throw "package.json dice '$pkgVersion' y el tag pide '$env:VERSION'" }
          if (-not $conf.plugins.updater.pubkey) { throw 'tauri.conf.json no tiene plugins.updater.pubkey' }
          "product=$($conf.productName)" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "| Version | tauri.conf.json y package.json = $env:VERSION; commit $(git rev-parse --short HEAD) |" >> $env:REPORT

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust estable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          "| Toolchain | $(node --version), $(rustc --version) |" >> $env:REPORT

      - name: Cache de Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target
          key: ${{ inputs.app }}

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Tests (npm test)
        working-directory: app
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'npm test falla' }
          '| npm test | OK |' >> $env:REPORT

      # dist/ tiene que existir: tauri::generate_context! lo embebe al compilar.
      - name: Tests de Rust (cargo test --lib)
        working-directory: app
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'npm run build falla' }
          Push-Location src-tauri
          cargo test --lib
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw 'cargo test --lib falla' }
          '| cargo test --lib | OK |' >> $env:REPORT

      - name: Herramientas de firma (signtool + Azure Trusted Signing)
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' |
            Sort-Object { [version]($_.Directory.Parent.Name) } | Select-Object -Last 1
          if (-not $signtool) { throw 'No hay signtool.exe del Windows SDK en el runner' }
          $nupkg = Join-Path $env:RUNNER_TEMP 'trusted-signing-client.zip'
          Invoke-WebRequest -UseBasicParsing -OutFile $nupkg -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.trusted.signing.client/$env:TS_CLIENT_VERSION/microsoft.trusted.signing.client.$env:TS_CLIENT_VERSION.nupkg"
          $hash = (Get-FileHash $nupkg -Algorithm SHA256).Hash
          if ($hash -ne $env:TS_CLIENT_SHA256) { throw "El nupkg de Trusted Signing no es el esperado (SHA256 $hash)" }
          $client = Join-Path $env:RUNNER_TEMP 'trusted-signing-client'
          Expand-Archive -Path $nupkg -DestinationPath $client
          $dlib = Join-Path $client 'bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path $dlib)) { throw 'Falta Azure.CodeSigning.Dlib.dll en el nupkg' }
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "TS_DLIB=$dlib" >> $env:GITHUB_ENV
          "TS_METADATA=$env:GITHUB_WORKSPACE\factory\signing\metadata.json" >> $env:GITHUB_ENV
          # signCommand de la fabrica, sin rutas del portatil y sin tocar el repo de la app.
          # createUpdaterArtifacts=false (S-658): Cat y Greenjay lo llevan a true y Tauri pediria la clave
          # privada durante el build; el .sig se genera mas abajo con la clave de la app.
          $override = @{ bundle = @{ createUpdaterArtifacts = $false; windows = @{ signCommand = "$env:GITHUB_WORKSPACE\factory\signing\sign.cmd %1" } } }
          $override | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'factory.tauri.conf.json') -Encoding utf8
          "| Firma | signtool $($signtool.Directory.Parent.Name), Trusted Signing client $env:TS_CLIENT_VERSION (hash comprobado) |" >> $env:REPORT

      # Tauri firma con signCommand el .exe, los plugins de NSIS, uninstall.exe y el instalador.
      - name: tauri build (NSIS, firmado)
        working-directory: app
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          foreach ($n in 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))) { throw "Falta el secreto $n" }
          }
          node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis --config (Join-Path $env:RUNNER_TEMP 'factory.tauri.conf.json')
          if ($LASTEXITCODE -ne 0) { throw 'tauri build falla' }

      - name: Instalador, firma Authenticode y firma del actualizador
        id: artifacts
        working-directory: app
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
          KEY_NAME: ${{ steps.meta.outputs.tauri_key_secret }}
          TAURI_KEY_CONTENT: ${{ secrets[steps.meta.outputs.tauri_key_secret] }}
        run: |
          $found = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*_$($env:VERSION)_x64-setup.exe")
          if ($found.Count -ne 1) { throw "Se esperaba 1 instalador *_$($env:VERSION)_x64-setup.exe y hay $($found.Count)" }
          $setup = Join-Path $env:OUT $env:ASSET
          Copy-Item $found[0].FullName $setup

          # Authenticode del instalador
          & $env:SIGNTOOL verify /pa /v $setup
          if ($LASTEXITCODE -ne 0) { throw 'signtool verify /pa falla en el instalador' }
          $signer = (Get-AuthenticodeSignature $setup).SignerCertificate.Subject -replace '^CN=([^,]+).*', '$1'
          "| Authenticode del instalador | signtool verify /pa OK; firmante $signer |" >> $env:REPORT

          # .sig del actualizador (minisign) con la clave de la app. La clave va a un fichero
          # temporal del runner, nunca al log ni a un artefacto, y se borra al acabar el job.
          if ([string]::IsNullOrWhiteSpace($env:TAURI_KEY_CONTENT)) { throw "El secreto $env:KEY_NAME esta vacio o no existe" }
          $key = Join-Path $env:RUNNER_TEMP 'tauri-updater.key'
          [IO.File]::WriteAllText($key, $env:TAURI_KEY_CONTENT.Trim())
          $env:TAURI_KEY_CONTENT = $null
          node node_modules/@tauri-apps/cli/tauri.js signer sign --private-key-path $key --password '' $setup
          $code = $LASTEXITCODE
          Remove-Item $key -Force
          if ($code -ne 0) { throw 'tauri signer sign falla' }
          if (-not (Test-Path "$setup.sig")) { throw 'No se genero el .sig' }

          # El .sig verifica con la clave publica que la app lleva embebida
          python -m pip install --disable-pip-version-check --quiet cryptography==49.0.0
          $pubkey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          python "$env:GITHUB_WORKSPACE\factory\scripts\verify_minisign.py" $setup "$setup.sig" $pubkey
          if ($LASTEXITCODE -ne 0) { throw 'El .sig no verifica con la pubkey de tauri.conf.json' }
          '| .sig del actualizador | verificado con la pubkey de tauri.conf.json |' >> $env:REPORT

          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path $env:OUT 'SHA256SUMS.txt'), "$sha *$($env:ASSET)`n")
          $mb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          "| Instalador | ``$env:ASSET``, $mb MB, SHA256 ``$sha`` |" >> $env:REPORT

      # S-1275 (PAA2 P6-1): antes del smoke limpio, la actualizacion desde la version anterior
      # publicada: instalar la anterior, abrirla y cerrarla, actualizar, comprobar los ajustes y
      # desinstalar. smoke-update.ps1 deja la maquina como estaba para el smoke limpio.
      - name: Version anterior para probar la actualizacion
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ secrets.APPS_TOKEN }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'anterior.json'
          python "$env:GITHUB_WORKSPACE\factory\scripts\anterior.py" --app $env:APP --repo $env:APP_REPO --version $env:VERSION --dest (Join-Path $env:RUNNER_TEMP 'anterior') --out $out
          if ($LASTEXITCODE -ne 0) { throw 'anterior.py falla (una descarga no cuadra con su hash)' }
          "ANTERIOR_JSON=$out" >> $env:GITHUB_ENV
          $a = Get-Content $out -Raw | ConvertFrom-Json
          if ($a.no_aplica) { "| Version anterior | no hay: $($a.no_aplica) |" >> $env:REPORT }
          else { "| Version anterior | v$($a.version), de $($a.origen); SHA256 comprobado |" >> $env:REPORT }

      - name: Prueba de actualizacion en el runner
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
          PRODUCT: ${{ steps.conf.outputs.product }}
        run: |
          $a = Get-Content $env:ANTERIOR_JSON -Raw | ConvertFrom-Json
          if ($a.no_aplica) { 'Sin version anterior: no hay actualizacion que probar'; exit 0 }
          $json = Join-Path $env:RUNNER_TEMP 'actualizacion.json'
          & "$env:GITHUB_WORKSPACE\factory\scripts\smoke-update.ps1" -Kind nsis -ProductName $env:PRODUCT -Previous $a.ruta -PreviousVersion $a.version -Installer (Join-Path $env:OUT $env:ASSET) -Version $env:VERSION -Report $env:REPORT -Json $json
          "UPDATE_JSON=$json" >> $env:GITHUB_ENV

      - name: Smoke del instalador en el runner
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
          PRODUCT: ${{ steps.conf.outputs.product }}
        run: |
          & "$env:GITHUB_WORKSPACE\factory\scripts\smoke-nsis.ps1" -Installer (Join-Path $env:OUT $env:ASSET) -ProductName $env:PRODUCT -Version $env:VERSION -SignTool $env:SIGNTOOL -Report $env:REPORT

      # S-1276 (PAA2 P6-2): render real antes de la release (nivel 2 del laboratorio,
      # docs/organizacion/03-calidad.md §3 del central). Solo para las apps con inventario de
      # pantallas en el central (scripts/ui_fit/<app>.mjs). Dos pasadas con check_ui_fit_tauri.mjs:
      # las pantallas del inventario en las 4 combinaciones de riesgo, en Edge con ventana real
      # (el metodo calibrado en P1-4), y la app instalada de verdad con su WebView2, medida desde
      # dentro y capturada con su ventana. Deja <app>-v<ver>-informe-visual.json y las capturas.
      # No para el build: un informe en rojo o sin medir lo para publish.py donde la ficha lo exige.
      - name: Checkout del central (solo la medida visual)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: javierferraz/2606-thestromboliproject
          token: ${{ secrets.APPS_TOKEN }}
          path: central
          sparse-checkout: |
            scripts/check_ui_fit_tauri.mjs
            scripts/ui_fit
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Render real (nivel 2) e informe visual
        continue-on-error: true
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
          PRODUCT: ${{ steps.conf.outputs.product }}
        run: |
          $central = Join-Path $env:GITHUB_WORKSPACE 'central\scripts'
          if (-not (Test-Path (Join-Path $central "ui_fit\$env:APP.mjs"))) {
            '| Informe visual (nivel 2) | la app no tiene inventario de pantallas en el central: sin medida |' >> $env:REPORT
            exit 0
          }
          $t0 = Get-Date
          $dir = Join-Path $env:RUNNER_TEMP 'visual'
          $medida = Join-Path $dir 'medida'
          $inst = Join-Path $dir 'instalada'
          $mjs = Join-Path $central 'check_ui_fit_tauri.mjs'
          # El runner arranca a 1024x768: la ventana por defecto de las apps no cabe.
          pwsh -NoProfile -File (Join-Path $central 'ui_fit\captura_ventana.ps1') -Resolucion 1920x1080

          # 1. Pantallas del inventario, combinaciones de riesgo, interfaz construida en el tag (app\dist).
          node $mjs --app app --inventario $env:APP --navegador edge --dist dist --riesgo --ventana --paralelo 2 --salida $medida
          "medida: salida $LASTEXITCODE"

          # 2. La app instalada de verdad (el smoke ya la desinstalo: se instala otra vez y se quita al final).
          $p = Start-Process -FilePath (Join-Path $env:OUT $env:ASSET) -ArgumentList '/S' -Wait -PassThru
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -eq $env:PRODUCT }
          if ($p.ExitCode -eq 0 -and $entry) {
            $unins = ($entry.UninstallString -replace '"', '').Trim()
            $exe = (Get-ChildItem (Split-Path -Parent $unins) -Filter '*.exe' | Where-Object { $_.Name -ne 'uninstall.exe' } | Select-Object -First 1).FullName
            node $mjs --app app --inventario $env:APP --instalada $exe --salida $inst
            "instalada: salida $LASTEXITCODE"
            Start-Process -FilePath $unins -ArgumentList '/S' -Wait | Out-Null
          } else { "no se pudo instalar para el render real (codigo $($p.ExitCode))" }

          $commit = (git -C app rev-parse HEAD).Trim()
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          python "$env:GITHUB_WORKSPACE\factory\scripts\informe_visual.py" --app $env:APP --version $env:VERSION --tag $env:TAG --commit $commit --ejecucion $run --medida $medida --instalada $inst --out-dir $env:OUT --report $env:REPORT
          if ($LASTEXITCODE -ne 0) { throw 'informe_visual.py falla' }
          "VISUAL=$env:APP-v$env:VERSION-informe-visual.json" >> $env:GITHUB_ENV
          "CAPTURAS=$env:APP-v$env:VERSION-capturas.zip" >> $env:GITHUB_ENV
          "| Render real · duracion | $([math]::Round(((Get-Date) - $t0).TotalSeconds)) s |" >> $env:REPORT
          exit 0

      # S-1275: lo que publish.py pone en la ficha de release. Solo se llega aqui si todas las
      # pruebas anteriores han pasado.
      - name: Informe de pruebas para la ficha
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TESTS_EN: windows (npm test y cargo test)
        run: |
          $commit = (git -C app rev-parse HEAD).Trim()
          $file = "$env:APP-v$env:VERSION-windows-pruebas.json"
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $pargs = @('--app', $env:APP, '--version', $env:VERSION, '--tag', $env:TAG, '--commit', $commit,
                     '--ejecucion', $run, '--tests-en', $env:TESTS_EN, '--instalador', 'nsis',
                     '--anterior', $env:ANTERIOR_JSON, '--out', (Join-Path $env:OUT $file),
                     '--herramienta', "node=$((node --version).Trim())", '--herramienta', "rust=$(((rustc --version) -split ' ')[1])")
          if ($env:UPDATE_JSON) { $pargs += @('--actualizacion', $env:UPDATE_JSON) }
          python "$env:GITHUB_WORKSPACE\factory\scripts\pruebas_windows.py" @pargs
          if ($LASTEXITCODE -ne 0) { throw 'pruebas_windows.py falla' }
          "PRUEBAS=$file" >> $env:GITHUB_ENV
          "| Informe de pruebas | ``$file`` (commit ``$($commit.Substring(0, 12))``) |" >> $env:REPORT

      - name: Subir a la Release del repo de la app
        env:
          GH_TOKEN: ${{ secrets.APPS_TOKEN }}
          ASSET: ${{ steps.meta.outputs.asset }}
          PRODUCT: ${{ steps.conf.outputs.product }}
        run: |
          gh release view $env:TAG -R $env:APP_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG -R $env:APP_REPO --prerelease --verify-tag --title "$env:PRODUCT $env:TAG" --notes 'Windows build from the release factory (signed installer and updater signature). Not published yet.'
            if ($LASTEXITCODE -ne 0) { throw "No se pudo crear la Release $env:TAG" }
            $created = 'creada como prerelease'
          } else { $created = 'ya existia' }
          $names = gh release view $env:TAG -R $env:APP_REPO --json assets --jq '.assets[].name'
          # S-1276: el informe visual y las capturas, si el render real los ha dejado.
          $visual = @(@($env:VISUAL, $env:CAPTURAS) | Where-Object { $_ -and (Test-Path (Join-Path $env:OUT $_)) })
          $clash = @($names | Where-Object { $_ -in (@($env:ASSET, "$env:ASSET.sig", 'SHA256SUMS.txt', $env:PRUEBAS) + $visual) })
          if ($clash.Count) { throw "La Release ya tiene: $($clash -join ', '). No se pisan." }
          Push-Location $env:OUT
          gh release upload $env:TAG -R $env:APP_REPO $env:ASSET "$env:ASSET.sig" SHA256SUMS.txt $env:PRUEBAS @visual
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw 'gh release upload falla' }
          $extra = if ($visual.Count) { ', ' + (($visual | ForEach-Object { "``$_``" }) -join ', ') } else { '' }
          "| Release $env:TAG | $created; subidos ``$env:ASSET``, ``.sig``, ``SHA256SUMS.txt``, ``$env:PRUEBAS``$extra |" >> $env:REPORT

      - name: Resumen
        if: always()
        run: |
          if (Test-Path $env:REPORT) { Get-Content $env:REPORT >> $env:GITHUB_STEP_SUMMARY }
          Remove-Item (Join-Path $env:RUNNER_TEMP 'tauri-updater.key') -Force -ErrorAction SilentlyContinue
