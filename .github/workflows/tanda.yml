# S-1069 R8: lleva a cabo la tanda de releases que prepara el Vigía Releases del central (R7).
#
# Lanzarlo ES el «sí» de Javier: el aviso [RELEASES] de Telegram trae el botón «Sí, publica la
# tanda», que abre esta página; «Run workflow» con «Ensayo» desmarcado publica. Así el «sí» pasa por
# el login y el 2FA de GitHub y no hace falta ningún servidor escuchando el bot.
# Sin «sí» en 24 h la tanda caduca: scripts/tanda.py plan la rechaza.
#
# Por cada app lista:
#   1. Si falta el tag: integra las ramas «Rama: terminada» de la tanda (R11), sube la versión,
#      sella el CHANGELOG, commit y tag vX.Y.Z en su repo, y borra las ramas integradas.
#   2. Construye en esta fábrica lo que la Release aún no tenga: Windows y después Linux (una a una
#      para que no compitan al crear la Release).
#   3. Sube release-notes.json (las notas en inglés de la tanda) a la Release.
#   Las apps que fallan en 1-3 se quedan fuera; las demás siguen.
#   4. Lanza publish.yml con las que llegaron y espera su resultado.
#   5. Sube el resultado (qué se publicó, qué se quedó fuera y los minutos) al central, donde
#      «TSP Cierre de tanda» la cierra y avisa por Telegram (R9).
#
# En ensayo (por defecto): no hace push ni tags (solo comprueba que el token podría), no construye
# nada, y publish.yml corre en seco con las notas de la tanda; solo entran las apps que ya tienen
# tag y Release (p. ej. una primera versión ya construida).

name: Tanda
run-name: Tanda ${{ inputs.fecha || '(la última)' }} ${{ inputs.dry_run && '(ensayo)' || '(REAL)' }}

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha de la tanda (AAAA-MM-DD); vacío = la última'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Ensayo: sin tags, sin builds y publicación en seco. Desmárcalo para publicar.'
        required: false
        type: boolean
        default: true

# GITHUB_TOKEN solo lanza y sigue los workflows de esta fábrica; los repos de las apps y el central
# van con APPS_TOKEN.
permissions:
  contents: read
  actions: write

concurrency:
  group: tanda
  cancel-in-progress: false

jobs:
  tanda:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      FECHA: ${{ inputs.fecha }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout de la fabrica
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan
        env:
          GH_TOKEN: ${{ secrets.APPS_TOKEN }}
        run: |
          [ "$DRY_RUN" = true ] || [ "$DRY_RUN" = false ] || { echo "::error::dry_run no valido"; exit 1; }
          [ -z "$FECHA" ] || [[ "$FECHA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::fecha no valida: '$FECHA'"; exit 1; }
          echo "T=$RUNNER_TEMP/tanda" >> "$GITHUB_ENV"
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          python3 scripts/tanda.py plan --fecha "$FECHA" --out "$RUNNER_TEMP/tanda" | tee "$RUNNER_TEMP/plan.txt"
          { echo "## Tanda $(jq -r .fecha "$RUNNER_TEMP/tanda/plan.json") $([ "$DRY_RUN" = true ] && echo '(ensayo)' || echo '(REAL)')"
            echo; echo '```'; cat "$RUNNER_TEMP/plan.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          : > "$RUNNER_TEMP/tanda/listas.txt"
          : > "$RUNNER_TEMP/tanda/minutos.txt"   # «windows|linux N» por cada build lanzado
          : > "$RUNNER_TEMP/tanda/fuera.jsonl"   # {"app","motivo"} de las que se quedan fuera

      - name: Tags, builds y notas
        env:
          GH_TOKEN: ${{ secrets.APPS_TOKEN }}
          FACTORY_TOKEN: ${{ github.token }}
        run: |
          plan="$T/plan.json"
          git config --global user.name "tsp-tanda"
          git config --global user.email "actions@users.noreply.github.com"
          resumen() { echo "- $*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          fuera() {   # la app se queda fuera: al resumen y al resultado que cierra la tanda (R9)
            resumen "$app $ver: $1, fuera"
            jq -nc --arg app "$app" --arg m "$1" '{app: $app, motivo: $m}' >> "$T/fuera.jsonl"
          }
          lanzar() {  # lanza un workflow de esta fabrica, espera a que acabe bien y apunta sus minutos
            local wf=$1 url id rc=0 so; shift
            url=$(GH_TOKEN=$FACTORY_TOKEN gh workflow run "$wf" -R "$GITHUB_REPOSITORY" --ref main "$@" 2>&1 | grep -o 'https://[^ ]*/runs/[0-9]*' | tail -1)
            [ -n "$url" ] || { echo "no pude lanzar $wf"; return 1; }
            id=${url##*/}
            echo "$wf -> $url"
            GH_TOKEN=$FACTORY_TOKEN gh run watch "$id" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null || rc=$?
            case "$wf" in *windows*) so=windows ;; *) so=linux ;; esac
            echo "$so $(GH_TOKEN=$FACTORY_TOKEN gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.startedAt != null and .completedAt != null) | (((.completedAt | fromdate) - (.startedAt | fromdate)) / 60 | ceil)] | add // 0' 2>/dev/null || echo 0)" >> "$T/minutos.txt"
            return $rc
          }
          n=$(jq '.apps | length' "$plan")
          for i in $(seq 0 $((n - 1))); do
            get() { jq -r ".apps[$i].$1" "$plan"; }
            app=$(get app); repo=$(get repo); ver=$(get version); tag=$(get tag); stack=$(get stack)
            if [ "$(get accion)" != publicar ]; then resumen "$app $ver: $(get motivo)"; continue; fi
            [[ "$app" =~ ^[a-z0-9-]+$ && "$repo" =~ ^javierferraz/[A-Za-z0-9._-]+$ && "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$stack" =~ ^(tauri|pyside)$ ]] \
              || { fuera "entrada no valida en la tanda"; continue; }

            # 1. Tag
            if [ "$(get crear_tag)" = true ]; then
              dir="$RUNNER_TEMP/app-$app"
              git clone -q "https://x-access-token:${GH_TOKEN}@github.com/$repo.git" "$dir"                 || { fuera "no pude clonar $repo"; continue; }
              # R11: las ramas «Rama: terminada» de la tanda entran en la principal antes de sellar
              integradas=""
              if [ "$(jq ".apps[$i].ramas // [] | length" "$plan")" != 0 ]; then
                if ! integradas=$(cd "$dir" && python3 "$GITHUB_WORKSPACE/scripts/tanda.py" integrar --dir . --plan "$plan" --app "$app"); then
                  fuera "no pude integrar sus ramas terminadas (${integradas#::error::})"; continue
                fi
                [ -z "$integradas" ] || resumen "$app $ver: ramas integradas en la principal: $integradas"
              fi
              if ! tocados=$(cd "$dir" && python3 "$GITHUB_WORKSPACE/scripts/tanda.py" sellar --dir . --version "$ver" --stack "$stack" --fecha "$(date -u +%F)"); then
                fuera "no pude subir la versión o sellar el CHANGELOG"; continue
              fi
              read -ra files <<< "$tocados"
              ( cd "$dir" && git add -- "${files[@]}" && git commit -q -m "release: v$ver (tanda $(jq -r .fecha "$plan"))" && git tag -a "$tag" -m "$tag" )                 || { fuera "no pude hacer el commit o el tag"; continue; }
              ( cd "$dir" && git --no-pager show --stat --format='%s' HEAD )
              if [ "$DRY_RUN" = true ]; then
                if ( cd "$dir" && git push --dry-run -q origin HEAD "$tag" ); then
                  resumen "$app $ver: ensayo, se crearía el tag $tag (el token puede subirlo); sin tag no se construye ni se publica"
                else
                  resumen "$app $ver: ensayo, el token NO puede subir el tag a $repo"
                fi
                continue
              fi
              if ! ( cd "$dir" && git push -q origin HEAD "$tag" ); then
                fuera "no pude subir el commit y el tag"; continue
              fi
              resumen "$app $ver: versión subida, CHANGELOG sellado y tag $tag creado"
              for rama in $integradas; do   # ya están en la principal: se borran si nadie las movió después
                sha=$(jq -r --arg r "$rama" ".apps[$i].ramas[] | select(.rama == \$r) | .sha" "$plan")
                remoto=$(cd "$dir" && git ls-remote origin "refs/heads/$rama" | cut -f1)
                if [ "$remoto" = "$sha" ] && ( cd "$dir" && git push -q origin --delete "$rama" ); then
                  resumen "$app $ver: rama $rama borrada (ya está en la principal)"
                else
                  resumen "$app $ver: rama $rama no se borra (se movió después de la tanda o no pude)"
                fi
              done
            fi

            # 2. Builds (Windows y despues Linux)
            ok=true
            for plat in windows linux; do
              [ "$(get "build_$plat")" = true ] || continue
              if [ "$DRY_RUN" = true ]; then
                resumen "$app $ver: ensayo, faltaría construir $plat; no se publica en seco"; ok=false; continue
              fi
              if lanzar "build-$stack-$plat.yml" -f app="$app" -f repo="$repo" -f tag="$tag"; then
                resumen "$app $ver: build de $plat verde"
              else
                fuera "falló el build de $plat"; ok=false; break
              fi
            done
            $ok || continue

            # 3. Notas
            python3 scripts/tanda.py notas --plan "$plan" --app "$app" --out "$T/release-notes.json"
            if [ "$DRY_RUN" = false ]; then
              if ! gh release upload "$tag" "$T/release-notes.json" -R "$repo" --clobber; then
                fuera "no pude subir release-notes.json"; continue
              fi
            fi
            echo "$i" >> "$T/listas.txt"
          done

      - name: Publicar
        env:
          FACTORY_TOKEN: ${{ github.token }}
        run: |
          plan="$T/plan.json"
          if [ ! -s "$T/listas.txt" ]; then
            echo "- Ninguna app llegó a publicarse" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          idx=$(paste -sd, "$T/listas.txt")
          apps=$(jq -c "[.apps[$idx] | {app, repo, version, platforms}]" "$plan")
          args=(-f apps="$apps" -f dry_run="$DRY_RUN")
          # El «sí» de Javier queda en la ficha de release (S-1275): quién lanzó esta tanda, cuándo y desde dónde.
          inicio=$(GH_TOKEN=$FACTORY_TOKEN gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)
          modo=$([ "$DRY_RUN" = true ] && echo ensayo || echo real)
          args+=(-f autorizacion="$(jq -nc --arg q "$GITHUB_ACTOR" --arg c "$inicio" \
            --arg t "Run workflow de la tanda ${FECHA:-(la última)} ($modo), desde el aviso [RELEASES]" \
            --arg e "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{quien: $q, cuando: $c, texto: $t, ejecucion: $e}')")
          if [ "$DRY_RUN" = true ]; then
            args+=(-f notas_seco="$(jq -c "[.apps[$idx] | {key: .app, value: (.notas | with_entries(select(.key == \"windows\" or .key == \"linux\")))}] | from_entries" "$plan")")
          fi
          echo "publish.yml con: $apps" | tee -a "$GITHUB_STEP_SUMMARY"
          url=$(GH_TOKEN=$FACTORY_TOKEN gh workflow run publish.yml -R "$GITHUB_REPOSITORY" --ref main "${args[@]}" 2>&1 | grep -o 'https://[^ ]*/runs/[0-9]*' | tail -1)
          [ -n "$url" ] || { echo "::error::no pude lanzar publish.yml"; exit 1; }
          echo "- publish.yml: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" > "$T/publish_run.txt"
          id=${url##*/} rc=0
          GH_TOKEN=$FACTORY_TOKEN gh run watch "$id" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null || rc=$?
          echo "linux $(GH_TOKEN=$FACTORY_TOKEN gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.startedAt != null and .completedAt != null) | (((.completedAt | fromdate) - (.startedAt | fromdate)) / 60 | ceil)] | add // 0' 2>/dev/null || echo 0)" >> "$T/minutos.txt"
          # resultado.json de publish.py: qué app se publicó y cuál no, para el cierre (R9)
          GH_TOKEN=$FACTORY_TOKEN gh run download "$id" -R "$GITHUB_REPOSITORY" -n "publish-$id" -D "$T/publish" || echo "sin artefacto de publish.yml"
          exit $rc

      # S-1069 R9: el resultado va al central (docs/distribucion/tandas/resultados/<fecha>.json) y su
      # workflow «TSP Cierre de tanda» cierra la tanda, apunta Linux en el ledger y avisa por Telegram.
      # También si algo falló: una tanda que no publica nada se cierra como «fallida» y se avisa.
      # En ensayo solo se comprueba que el token podría subirlo y queda como artefacto.
      - name: Resultado al central
        if: always()
        env:
          GH_TOKEN: ${{ secrets.APPS_TOKEN }}
        run: |
          plan="$T/plan.json"
          [ -f "$plan" ] || { echo "sin plan: no hay tanda que cerrar"; exit 0; }
          fecha=$(jq -r .fecha "$plan")
          res="$T/publish/resultado.json"
          [ -f "$res" ] || echo '{"apps": []}' > "$res"
          w=$(awk '$1 == "windows" {s += $2} END {print s + 0}' "$T/minutos.txt")
          l=$(awk '$1 == "linux" {s += $2} END {print s + 0}' "$T/minutos.txt")
          l=$(( l + ($(date +%s) - JOB_START) / 60 + 1 ))   # este job, que espera a los demás
          pr=$(cat "$T/publish_run.txt" 2>/dev/null || true)
          jq --arg modo "$([ "$DRY_RUN" = true ] && echo seco || echo real)" \
             --arg tr "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg pr "$pr" \
             --argjson w "$w" --argjson l "$l" --slurpfile fuera "$T/fuera.jsonl" \
             '. + {modo: (.modo // $modo), tanda_run: $tr, publish_run: (if $pr == "" then null else $pr end),
                   fuera: $fuera, minutos: {windows: $w, linux: $l, facturables: ($w * 2 + $l)}}' \
             "$res" > "$T/resultado-tanda.json"
          cat "$T/resultado-tanda.json"
          dir="$RUNNER_TEMP/central"
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/javierferraz/2606-thestromboliproject.git" "$dir"
          mkdir -p "$dir/docs/distribucion/tandas/resultados"
          cp "$T/resultado-tanda.json" "$dir/docs/distribucion/tandas/resultados/$fecha.json"
          cd "$dir"
          git config user.name "tsp-tanda"
          git config user.email "actions@users.noreply.github.com"
          git add "docs/distribucion/tandas/resultados/$fecha.json"
          git diff --cached --quiet && { echo "el central ya tiene este resultado"; exit 0; }
          git commit -q -m "releases: resultado de la tanda $fecha [sin tarjeta]"
          if [ "$DRY_RUN" = true ]; then
            if git push --dry-run -q origin HEAD:main; then
              echo "- Ensayo: el resultado se subiría al central y cerraría la tanda (el token puede)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Ensayo: el token NO puede subir el resultado al central" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          for i in 1 2 3; do
            git push -q origin HEAD:main && { echo "- Resultado subido al central: lo cierra «TSP Cierre de tanda»" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            git pull -q --rebase origin main
          done
          echo "::error::no pude subir el resultado al central"; exit 1

      - name: Guardar el resultado
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tanda-${{ github.run_id }}
          path: ${{ runner.temp }}/tanda/resultado-tanda.json
          if-no-files-found: ignore
          retention-days: 14
